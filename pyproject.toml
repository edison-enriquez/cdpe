[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdpe"
version = "2.0.0"
description = "Single-position simulator for the Collateralized Debt Position of Energy (CDPE), Section 5 of the companion paper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Edison Ferney Enríquez Ceballos", email = "edison.enriquez@correounivalle.edu.co"}]
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
